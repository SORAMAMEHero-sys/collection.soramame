<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEEL THE BRAINROT</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; touch-action: manipulation; margin: 0; padding: 10px; position: relative; }
        
        /* 右上の設定ボタン */
        #settings-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #444;
            color: white;
            border: 2px solid #777;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 左上の強化ボタン */
        #upgrade-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #444;
            color: white;
            border: 2px solid #777;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* モーダル共通 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #555;
            width: 85%;
            max-width: 380px;
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 { margin-top: 0; text-align: center; }
        .setting-group { margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }

        /* 巨大な丸い攻撃ボタン */
        #attack-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 28px;
            font-weight: bold;
            border: 5px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            cursor: pointer;
            margin: 20px auto;
            display: block;
            outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        #attack-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        button { padding: 8px 14px; font-size: 14px; margin: 3px; cursor: pointer; }
        #admin-panel { display: none; background: #400; padding: 20px; border: 2px solid red; margin-top: 20px; text-align: left; }
        .panel { border: 1px solid #555; padding: 10px; margin: 10px auto; max-width: 500px; background: #333; text-align: left; }
        
        .item-list { font-size: 14px; color: #fff; max-height: 160px; overflow-y: auto; background: #222; padding: 5px; margin-top: 5px; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid #444; }
        .list-row span { flex-grow: 1; margin-left: 8px; }

        #enemy-emoji { font-size: 56px; margin: 10px 0; }
        .status-container { font-size: 16px; font-weight: bold; margin: 10px 0; }
        .currency-box { font-size: 15px; font-weight: bold; background: #111; padding: 8px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-around; }
    </style>
</head>
<body>

<!-- 左上の強化ボタン -->
<button id="upgrade-btn">💪</button>
<!-- 右上の設定ボタン -->
<button id="settings-btn">⚙️</button>

<!-- 強化モーダル -->
<div id="upgrade-modal" class="modal">
    <div class="modal-content">
        <h2>強化</h2>
        <div class="setting-group">
            <button id="up-attack" style="width: 100%; background: #555; color: white;">攻撃力 +1 (10コイン)</button>
        </div>
        <div class="setting-group">
            <button id="up-efficiency" style="width: 100%; background: #555; color: white;">効率化 -0.1秒 (25コイン)</button>
        </div>
        <div class="setting-group">
            <button id="up-luck" style="width: 100%; background: #555; color: white;">ラックティア Lv.<span id="luck-lv">0</span>/3 (100コイン)</button>
        </div>
        <button id="close-upgrade" style="width: 100%; background: #222; color: white; margin-top: 10px;">閉じる</button>
    </div>
</div>

<!-- 設定モーダル -->
<div id="settings-modal" class="modal">
    <div class="modal-content">
        <h2>設定</h2>
        
        <div class="setting-group">
            <p>激レア以下 自動売却:</p>
            <button id="auto-sell-toggle" style="width: 100%; background: #555; color: white;">OFF</button>
        </div>

        <div class="setting-group">
            <p>超レアの削除警告:</p>
            <button id="warning-toggle" style="width: 100%; background: #28a745; color: white;">ON</button>
        </div>

        <div class="setting-group">
            <p>コモンキャラ出現: <span id="common-status" style="color: #28a745;">ON</span></p>
            <button id="common-toggle" style="width: 100%; background: #555; color: white;">OFFにする (3500コイン)</button>
        </div>

        <div class="setting-group" style="text-align: center;">
            <button id="reset-data-btn" style="background: #a00; color: white; width: 100%;">データ削除</button>
        </div>

        <button id="close-settings" style="width: 100%; background: #222; color: white; margin-top: 10px;">閉じる</button>
    </div>
</div>

<h1>STEEL THE BRAINROT</h1>
<div id="game">
    <!-- 通貨表示 -->
    <div class="currency-box">
        <span>💰 コイン: <span id="coin-count">0</span></span>
        <span>💎 ルビー: <span id="ruby-count">0</span> (開発中😏)</span>
    </div>

    <div id="enemy-emoji">🥔</div>
    <div id="enemy-display" class="status-container">敵出現中！</div>
    <div id="hp-display">HP: --</div>
    <div id="timer-display">制限時間: 30秒</div>
    
    <button id="attack-btn">攻撃！</button>
    
    <div class="panel">
        <div class="inventory">インベントリ (<span id="inv-count">0</span>/50)</div>
        <div id="inv-list" class="item-list">（インベントリは空です）</div>
    </div>

    <div class="panel">
        <div class="base">コレクション基地 (<span id="base-count">0</span>/10) - 整理・強化発動中</div>
        <div id="base-list" class="item-list">（基地にキャラはいません）</div>
    </div>
</div>

<div id="admin-panel">
    <h2>管理者パネル</h2>
    <div style="margin-bottom: 10px;">
        <label>次に出るキャラ指定:</label><br>
        <select id="force-spawn-select" style="width: 100%; padding: 5px; margin-top: 5px; background: #222; color: white;">
            <option value="">ランダム (通常)</option>
        </select>
        <button id="apply-spawn-btn" style="width: 100%; margin-top: 5px; background: #555; color: white;">このキャラを次に出す</button>
    </div>
    <button id="add-admin-char" style="width: 100%; margin-bottom: 5px;">隠しキャラ「管理者そらまめ」ゲット</button>
    <button id="admin-add-coins" style="width: 100%; margin-bottom: 5px; background: #d4af37; color: black; font-weight: bold;">コイン +1000 貰う</button>
    <button id="admin-add-rubies" style="width: 100%; background: #e50914; color: white; font-weight: bold;">ルビー +100 貰う (開発中😏)</button>
</div>

<script>
    // --- サウンド生成用 (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let now = audioCtx.currentTime;

        if (type === 'super') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.setValueAtTime(880, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'legend') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- ゲームデータ ---
    let state = {
        coins: 0,
        rubies: 0,
        inventory: [],
        collection: [],
        attackLv: 0,
        efficiencyLv: 0,
        luckLv: 0,
        adminMode: false,
        autoSellEnabled: false,
        warningEnabled: true,     
        commonEnabled: true,      
        forcedNextCharacter: ""   
    };

    // --- セーブ機能 ---
    function loadGame() {
        const saved = localStorage.getItem('brainrot_save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state.coins = parsed.coins || 0;
                state.rubies = parsed.rubies || 0;
                state.inventory = parsed.inventory || [];
                state.collection = parsed.collection || [];
                state.attackLv = parsed.attackLv || 0;
                state.efficiencyLv = parsed.efficiencyLv || 0;
                state.luckLv = parsed.luckLv || 0;
                state.autoSellEnabled = parsed.autoSellEnabled || false;
                state.warningEnabled = parsed.warningEnabled !== undefined ? parsed.warningEnabled : true;
                state.commonEnabled = parsed.commonEnabled !== undefined ? parsed.commonEnabled : true;
            } catch(e) {
                console.error("セーブデータの読み込みに失敗しました", e);
            }
        }
    }

    function saveGame() {
        localStorage.setItem('brainrot_save', JSON.stringify(state));
    }
    setInterval(saveGame, 3000);

    // --- モンスターデータ ---
    const monsterTable = [
        // コモン
        { name: "ぽてとまん", rarity: "コモン", hp: 10, attackUp: 1, emoji: "🥔" },
        { name: "ぞうすい", rarity: "コモン", hp: 10, attackUp: 1, emoji: "🥣" },
        { name: "そらまめ", rarity: "コモン", hp: 10, attackUp: 1, emoji: "🟢" },
        // レア
        { name: "どうごーれむ", rarity: "レア", hp: 50, attackUp: 2, emoji: "🗿" },
        { name: "にあれい", rarity: "レア", hp: 50, attackUp: 2, emoji: "🤖" },
        { name: "兵士そらまめ", rarity: "レア", hp: 50, attackUp: 3, emoji: "🪖" },
        // 激レア
        { name: "上級海兵そらまめ", rarity: "激レア", hp: 100, attackUp: 4, emoji: "⚓" },
        // 超レア (HP3000)
        { name: "きんごーれむ", rarity: "超レア", hp: 3000, attackUp: 5, trait: "crit", emoji: "✨🗿" },
        { name: "きんぐそらまめ", rarity: "超レア", hp: 3000, attackUp: 7, trait: "timer17", emoji: "👑" },
        // 伝説レア (HP10000)
        { name: "魔王そらまめ", rarity: "伝説レア", hp: 10000, attackUp: 15, trait: "timer5", emoji: "🔥😈" }
    ];

    let currentEnemy = null;
    let enemyHp = 0;
    let timeLeft = 30;
    let timerInterval = null;

    function getTotalAttack() {
        let base = 1 + state.attackLv;
        state.collection.forEach(c => {
            base += (c.attackUp || 0);
        });
        return base;
    }

    // 敵のスポーン確率調整ロジック（ラックティア反映）
    function spawnEnemy() {
        let enemy = null;

        if (state.forcedNextCharacter) {
            let found = monsterTable.find(m => m.name === state.forcedNextCharacter);
            if (found) {
                enemy = { ...found };
            }
            state.forcedNextCharacter = "";
            document.getElementById('force-spawn-select').value = "";
        }

        if (!enemy) {
            let rarityRoll = Math.random();
            let rarity = "コモン";
            
            // ラックティアによる確率変動 (超レア+0.3%, 伝説レア+0.1% / Lv)
            let superChance = 0.005 + (state.luckLv * 0.003);
            let legendChance = 0.0005 + (state.luckLv * 0.001);

            if (rarityRoll < legendChance) rarity = "伝説レア";
            else if (rarityRoll < superChance) rarity = "超レア";
            else if (rarityRoll < 0.035) rarity = "激レア";
            else if (rarityRoll < 0.185) rarity = "レア";

            if (!state.commonEnabled && rarity === "コモン") {
                rarity = "レア";
            }

            let candidates = monsterTable.filter(m => m.rarity === rarity);
            enemy = { ...candidates[Math.floor(Math.random() * candidates.length)] };
        }
        
        currentEnemy = enemy;
        enemyHp = enemy.hp;

        if (currentEnemy.rarity === "伝説レア") {
            playSound('legend');
        } else if (currentEnemy.rarity === "超レア") {
            playSound('super');
        }

        // 基本制限時間（特性 or 効率化による短縮）
        let limit = 30 - (state.efficiencyLv * 0.1);
        if (state.collection.some(c => c.name === "魔王そらまめ")) {
            limit = Math.min(limit, 5);
        } else if (state.collection.some(c => c.name === "きんぐそらまめ")) {
            limit = Math.min(limit, 17);
        }
        if (limit < 0.1) limit = 0.1; // 0.1秒が下限
        timeLeft = limit;

        startTimer();
        updateUI();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                spawnEnemy();
            }
            updateUI();
        }, 1000);
    }

    // 攻撃ボタン
    document.getElementById('attack-btn').addEventListener('click', () => {
        let dmg = getTotalAttack();
        if (state.collection.some(c => c.trait === "crit") && Math.random() < 0.05) {
            dmg *= 2;
        }

        enemyHp -= dmg;

        if (enemyHp <= 0) {
            if (currentEnemy.rarity === "レア") state.coins += 1;
            else if (currentEnemy.rarity === "激レア") state.coins += 10;
            else if (currentEnemy.rarity === "超レア") state.coins += 30;
            else if (currentEnemy.rarity === "伝説レア") state.coins += 100;

            let isLowRarity = ["コモン", "レア", "激レア"].includes(currentEnemy.rarity);
            if (state.autoSellEnabled && isLowRarity) {
                // 自動売却
            } else {
                if (state.inventory.length >= 50) {
                    alert("インベントリが50体上限のため、これ以上入手できません！");
                    enemyHp = 1;
                    return;
                }
                state.inventory.push(currentEnemy);
            }
            saveGame();
            spawnEnemy();
        } else {
            updateUI();
        }
    });

    // --- 強化モーダルの処理 ---
    document.getElementById('upgrade-btn').addEventListener('click', () => {
        document.getElementById('upgrade-modal').style.display = 'flex';
        updateUpgradeUI();
    });
    document.getElementById('close-upgrade').addEventListener('click', () => {
        document.getElementById('upgrade-modal').style.display = 'none';
    });

    // 1. 攻撃力アップ (+1 / 10コイン)
    document.getElementById('up-attack').addEventListener('click', () => {
        if (state.coins < 10) {
            alert("コインが足りません！ (10コイン必要)");
            return;
        }
        state.coins -= 10;
        state.attackLv++;
        saveGame();
        updateUI();
        updateUpgradeUI();
    });

    // 2. 効率化 (-0.1秒 / 25コイン)
    document.getElementById('up-efficiency').addEventListener('click', () => {
        if (state.coins < 25) {
            alert("コインが足りません！ (25コイン必要)");
            return;
        }
        // 特性を合わせてカウントダウンが0.1秒になったら買えなくなるチェック
        let currentLimit = 30 - ((state.efficiencyLv + 1) * 0.1);
        if (currentLimit < 0.1) {
            alert("これ以上効率化できません！");
            return;
        }
        state.coins -= 25;
        state.efficiencyLv++;
        saveGame();
        updateUI();
        updateUpgradeUI();
    });

    // 3. ラックティア (最大3個まで / 100コイン)
    document.getElementById('up-luck').addEventListener('click', () => {
        if (state.luckLv >= 3) {
            alert("ラックティアはすでに最大レベル（3）です！");
            return;
        }
        if (state.coins < 100) {
            alert("コインが足りません！ (100コイン必要)");
            return;
        }
        state.coins -= 100;
        state.luckLv++;
        saveGame();
        updateUI();
        updateUpgradeUI();
    });

    function updateUpgradeUI() {
        document.getElementById('luck-lv').innerText = state.luckLv;
    }

    // --- 設定モーダルの開閉 ---
    document.getElementById('settings-btn').addEventListener('click', () => {
        document.getElementById('settings-modal').style.display = 'flex';
        updateSettingsUI();
    });
    document.getElementById('close-settings').addEventListener('click', () => {
        document.getElementById('settings-modal').style.display = 'none';
    });

    // 自動売却トグル
    const autoSellToggleBtn = document.getElementById('auto-sell-toggle');
    autoSellToggleBtn.addEventListener('click', () => {
        state.autoSellEnabled = !state.autoSellEnabled;
        updateSettingsUI();
        saveGame();
    });

    // 超レア警告トグル
    const warningToggleBtn = document.getElementById('warning-toggle');
    warningToggleBtn.addEventListener('click', () => {
        state.warningEnabled = !state.warningEnabled;
        updateSettingsUI();
        saveGame();
    });

    // コモン出現トグル（3500コイン）
    const commonToggleBtn = document.getElementById('common-toggle');
    commonToggleBtn.addEventListener('click', () => {
        if (state.commonEnabled) {
            if (state.coins < 3500) {
                alert("コインが足りません！ (3500コイン必要です)");
                return;
            }
            if (confirm("3500コインを消費して、コモンキャラの出現をOFFにしますか？")) {
                state.coins -= 3500;
                state.commonEnabled = false;
                updateSettingsUI();
                saveGame();
            }
        } else {
            state.commonEnabled = true;
            updateSettingsUI();
            saveGame();
        }
    });

    // データ削除ボタン
    document.getElementById('reset-data-btn').addEventListener('click', () => {
        if (confirm("⚠️【警告】セーブデータ（コイン・インベントリ・基地・強化）がすべて消去されます。本当にリセットしますか？")) {
            if (confirm("本当に本当に消去してもよろしいですか？")) {
                localStorage.removeItem('brainrot_save');
                alert("データを削除しました。ページを再読み込みします。");
                location.reload();
            }
        }
    });

    function updateSettingsUI() {
        if (state.autoSellEnabled) {
            autoSellToggleBtn.innerText = "ON";
            autoSellToggleBtn.style.background = "#28a745";
        } else {
            autoSellToggleBtn.innerText = "OFF";
            autoSellToggleBtn.style.background = "#555";
        }

        if (state.warningEnabled) {
            warningToggleBtn.innerText = "ON";
            warningToggleBtn.style.background = "#28a745";
        } else {
            warningToggleBtn.innerText = "OFF";
            warningToggleBtn.style.background = "#555";
        }

        let commonStatusSpan = document.getElementById('common-status');
        if (state.commonEnabled) {
            commonStatusSpan.innerText = "ON";
            commonStatusSpan.style.color = "#28a745";
            commonToggleBtn.innerText = "OFFにする (3500コイン)";
            commonToggleBtn.style.background = "#555";
        } else {
            commonStatusSpan.innerText = "OFF";
            commonStatusSpan.style.color = "#e50914";
            commonToggleBtn.innerText = "ONにする";
            commonToggleBtn.style.background = "#28a745";
        }
    }

    // インベントリの削除・基地送り
    window.deleteInventoryItem = function(index) {
        let item = state.inventory[index];
        if (state.warningEnabled && (item.rarity === "超レア" || item.rarity === "伝説レア" || item.rarity === "神")) {
            if (!confirm(`⚠️【警告】「${item.name}（${item.rarity}）」を本当に削除しますか？`)) {
                return;
            }
        }
        state.inventory.splice(index, 1);
        saveGame();
        updateUI();
    };

    window.sendToBase = function(index) {
        if (state.collection.length >= 10) {
            alert("エラー：コレクション基地は最大10体までです！");
            return;
        }
        let item = state.inventory.splice(index, 1)[0];
        state.collection.push(item);
        saveGame();
        updateUI();
    };

    window.removeFromBase = function(index) {
        if (state.inventory.length >= 50) {
            alert("エラー：インベントリが50体上限のため、基地から外せません！");
            return;
        }
        let item = state.collection[index];
        if (state.warningEnabled && (item.rarity === "超レア" || item.rarity === "伝説レア" || item.rarity === "神")) {
            if (!confirm(`⚠️【警告】基地の「${item.name}（${item.rarity}）」を外しますか？`)) {
                return;
            }
        }
        state.collection.splice(index, 1);
        state.inventory.push(item);
        saveGame();
        updateUI();
    };

    // 管理者パネル判定
    if (window.location.href.includes("soramameadmin810")) {
        document.getElementById('admin-panel').style.display = 'block';
        state.adminMode = true;

        let select = document.getElementById('force-spawn-select');
        monsterTable.forEach(m => {
            let opt = document.createElement('option');
            opt.value = m.name;
            opt.innerText = `[${m.rarity}] ${m.emoji}${m.name}`;
            select.appendChild(opt);
        });
    }

    document.getElementById('apply-spawn-btn').addEventListener('click', () => {
        let selectedName = document.getElementById('force-spawn-select').value;
        if (selectedName) {
            state.forcedNextCharacter = selectedName;
            alert(`次に登場するキャラを「${selectedName}」に固定しました！次の敵を倒すと登場します。`);
        } else {
            alert("キャラが選択されていません。");
        }
    });

    document.getElementById('add-admin-char').addEventListener('click', () => {
        if (state.collection.length >= 10) {
            alert("コレクション基地が満杯です！");
            return;
        }
        state.collection.push({ name: "管理者そらまめ", rarity: "神", attackUp: 999, emoji: "👑🔥" });
        saveGame();
        updateUI();
    });

    document.getElementById('admin-add-coins').addEventListener('click', () => {
        state.coins += 1000;
        saveGame();
        updateUI();
        alert("コインを1000追加しました！");
    });

    document.getElementById('admin-add-rubies').addEventListener('click', () => {
        state.rubies += 100;
        saveGame();
        updateUI();
        alert("ルビーを100追加しました！ (開発中😏)");
    });

    function updateUI() {
        if (currentEnemy) {
            document.getElementById('enemy-emoji').innerText = currentEnemy.emoji || "❓";
            document.getElementById('enemy-display').innerText = `出現中: [${currentEnemy.rarity}] ${currentEnemy.name}`;
        }
        document.getElementById('hp-display').innerText = `HP: ${enemyHp} / 攻撃力: ${getTotalAttack()}`;
        document.getElementById('timer-display').innerText = `制限時間: ${timeLeft}秒`;
        document.getElementById('inv-count').innerText = state.inventory.length;
        document.getElementById('base-count').innerText = state.collection.length;
        document.getElementById('coin-count').innerText = state.coins;
        document.getElementById('ruby-count').innerText = state.rubies;

        let invContainer = document.getElementById('inv-list');
        invContainer.innerHTML = "";
        if (state.inventory.length === 0) {
            invContainer.innerHTML = "（インベントリは空です）";
        } else {
            state.inventory.forEach((c, i) => {
                let row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <span>${i+1}. ${c.emoji}${c.name}(+${c.attackUp})</span>
                    <button onclick="sendToBase(${i})">基地へ</button>
                    <button onclick="deleteInventoryItem(${i})" style="background:#500; color:white;">削除</button>
                `;
                invContainer.appendChild(row);
            });
        }

        let baseContainer = document.getElementById('base-list');
        baseContainer.innerHTML = "";
        if (state.collection.length === 0) {
            baseContainer.innerHTML = "（基地にキャラはいません）";
        } else {
            state.collection.forEach((c, i) => {
                let row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <span>${i+1}. ${c.emoji}${c.name}(+${c.attackUp})</span>
                    <button onclick="removeFromBase(${i})" style="background:#500; color:white;">外す</button>
                `;
                baseContainer.appendChild(row);
            });
        }
    }

    loadGame();
    spawnEnemy();
</script>
</body>
</html>
