<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEEL THE BRAINROT</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; touch-action: manipulation; margin: 0; padding: 10px; }
        button { padding: 12px 24px; font-size: 16px; margin: 5px; cursor: pointer; }
        #admin-panel { display: none; background: #400; padding: 20px; border: 2px solid red; margin-top: 20px; }
        .panel { border: 1px solid #555; padding: 10px; margin: 10px auto; max-width: 500px; background: #333; }
        .item-list { font-size: 13px; color: #aaa; max-height: 80px; overflow-y: auto; background: #222; padding: 5px; margin-top: 5px; text-align: left; }
        #enemy-emoji { font-size: 48px; margin: 10px 0; }
    </style>
</head>
<body>

<h1>STEEL THE BRAINROT</h1>
<div id="game">
    <div id="enemy-emoji">🥔</div>
    <div id="enemy-display">敵出現中！</div>
    <div id="hp-display">HP: --</div>
    <div id="timer-display">制限時間: 30秒</div>
    <button id="attack-btn">攻撃！</button>
    
    <div class="panel">
        <div class="inventory">インベントリ (<span id="inv-count">0</span>/50)</div>
        <div id="inv-list" class="item-list">（インベントリは空です）</div>
        <button id="sell-btn">インベントリの先頭を売却</button>
        <button id="to-base-btn">先頭をコレクション基地へ送る</button>
    </div>

    <div class="panel">
        <div class="base">コレクション基地 (<span id="base-count">0</span>/10)</div>
        <div id="base-list" class="item-list">（基地にキャラはいません）</div>
    </div>
</div>

<div id="admin-panel">
    <h2>管理者パネル</h2>
    <button id="add-admin-char">隠しキャラ「管理者そらまめ」ゲット</button>
</div>

<script>
    // --- サウンド生成用 (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let now = audioCtx.currentTime;

        if (type === 'super') {
            // 超レア用：キラキラした高めの2音
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.setValueAtTime(880, now + 0.1); // A5
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'legend') {
            // 伝説レア用：重厚でド派手な低音〜高音の連続音
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- ゲームデータ ---
    let state = {
        money: 0,
        inventory: [],
        collection: [],
        baseAttack: 1,
        adminMode: false
    };

    // --- セーブ機能の所（※セーブデータが絶対に消えないように、許可なしで絶対に触らないで） ---
    function loadGame() {
        const saved = localStorage.getItem('brainrot_save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state.money = parsed.money || 0;
                state.inventory = parsed.inventory || [];
                state.collection = parsed.collection || [];
            } catch(e) {
                console.error("セーブデータの読み込みに失敗しました", e);
            }
        }
    }

    function saveGame() {
        // セーブデータが絶対に消えないように、許可なしで絶対に触らないで
        localStorage.setItem('brainrot_save', JSON.stringify(state));
    }
    setInterval(saveGame, 3000);

    // --- モンスターデータ ---
    const monsterTable = [
        // コモン (60%)
        { name: "ぽてとまん", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🥔" },
        { name: "ぞうすい", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🥣" },
        { name: "そらまめ", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🟢" },
        // レア (20%)
        { name: "どうごーれむ", rarity: "レア", hp: 50, attackUp: 2, rate: 0.1, emoji: "🗿" },
        { name: "にあれい", rarity: "レア", hp: 50, attackUp: 2, rate: 0.07, emoji: "🤖" },
        { name: "兵士そらまめ", rarity: "レア", hp: 50, attackUp: 3, rate: 0.03, emoji: "🪖" },
        // 激レア (7%)
        { name: "上級海兵そらまめ", rarity: "激レア", hp: 100, attackUp: 4, rate: 0.07, emoji: "⚓" },
        // 超レア (2.5%)
        { name: "きんごーれむ", rarity: "超レア", hp: 300, attackUp: 5, rate: 0.02, trait: "crit", emoji: "✨🗿" },
        { name: "きんぐそらまめ", rarity: "超レア", hp: 300, attackUp: 7, rate: 0.005, trait: "timer17", emoji: "👑" },
        // 伝説レア (0.5%)
        { name: "魔王そらまめ", rarity: "伝説レア", hp: 500, attackUp: 15, rate: 0.005, trait: "timer5", emoji: "🔥😈" }
    ];

    let currentEnemy = null;
    let enemyHp = 0;
    let timeLeft = 30;
    let timerInterval = null;

    // 攻撃力計算
    function getTotalAttack() {
        let base = 1;
        state.collection.forEach(c => {
            base += (c.attackUp || 0);
        });
        return base;
    }

    // 敵のスポーン
    function spawnEnemy() {
        let rarityRoll = Math.random();
        let rarity = "コモン";
        
        if (rarityRoll < 0.005) rarity = "伝説レア";
        else if (rarityRoll < 0.03) rarity = "超レア";
        else if (rarityRoll < 0.1) rarity = "激レア";
        else if (rarityRoll < 0.3) rarity = "レア";

        if (state.adminMode && ["コモン", "レア", "激レア"].includes(rarity)) {
            rarity = "超レア";
        }

        let candidates = monsterTable.filter(m => m.rarity === rarity);
        let enemy = candidates[Math.floor(Math.random() * candidates.length)];
        
        currentEnemy = { ...enemy };
        enemyHp = enemy.hp;

        // レア度に応じた音の再生（管理者キャラは鳴らない）
        if (currentEnemy.rarity === "伝説レア") {
            playSound('legend');
        } else if (currentEnemy.rarity === "超レア") {
            playSound('super');
        }

        let limit = 30;
        if (state.collection.some(c => c.name === "魔王そらまめ")) {
            limit = 5;
        } else if (state.collection.some(c => c.name === "きんぐそらまめ")) {
            limit = 17;
        }
        timeLeft = limit;

        startTimer();
        updateUI();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                spawnEnemy();
            }
            updateUI();
        }, 1000);
    }

    // 攻撃ボタン
    document.getElementById('attack-btn').addEventListener('click', () => {
        if (state.inventory.length >= 50) {
            alert("インベントリが50体上限のため、攻撃できません！");
            return;
        }

        let dmg = getTotalAttack();
        if (state.collection.some(c => c.trait === "crit") && Math.random() < 0.05) {
            dmg *= 2;
        }

        enemyHp -= dmg;

        if (enemyHp <= 0) {
            state.inventory.push(currentEnemy);
            saveGame();
            spawnEnemy();
        } else {
            updateUI();
        }
    });

    // 売却ボタン
    document.getElementById('sell-btn').addEventListener('click', () => {
        if (state.inventory.length === 0) {
            alert("インベントリが空です！");
            return;
        }
        state.inventory.shift();
        saveGame();
        updateUI();
    });

    // 基地へ送るボタン
    document.getElementById('to-base-btn').addEventListener('click', () => {
        if (state.inventory.length === 0) {
            alert("インベントリが空です！");
            return;
        }
        if (state.collection.length >= 10) {
            alert("エラー：コレクション基地は最大10体までです！");
            return;
        }
        let char = state.inventory.shift();
        state.collection.push(char);
        saveGame();
        updateUI();
    });

    // 管理者パネル判定
    if (window.location.href.includes("Secretadmin810")) {
        document.getElementById('admin-panel').style.display = 'block';
        state.adminMode = true;
    }

    // 隠しキャラ追加ボタン
    document.getElementById('add-admin-char').addEventListener('click', () => {
        if (state.collection.length >= 10) {
            alert("コレクション基地が満杯です！");
            return;
        }
        state.collection.push({ name: "管理者そらまめ", rarity: "神", attackUp: 999, emoji: "👑🔥" });
        saveGame();
        updateUI();
    });

    // UI更新
    function updateUI() {
        if (currentEnemy) {
            document.getElementById('enemy-emoji').innerText = currentEnemy.emoji || "❓";
            document.getElementById('enemy-display').innerText = `出現中: [${currentEnemy.rarity}] ${currentEnemy.name}`;
        }
        document.getElementById('hp-display').innerText = `HP: ${enemyHp} / 攻撃力: ${getTotalAttack()}`;
        document.getElementById('timer-display').innerText = `制限時間: ${timeLeft}秒`;
        document.getElementById('inv-count').innerText = state.inventory.length;
        document.getElementById('base-count').innerText = state.collection.length;

        let invListText = state.inventory.map((c, i) => `${i+1}: ${c.emoji}${c.name}(+${c.attackUp})`).join(', ');
        document.getElementById('inv-list').innerText = invListText || "（インベントリは空です）";

        let baseListText = state.collection.map(c => `${c.emoji}${c.name}(+${c.attackUp})`).join(', ');
        document.getElementById('base-list').innerText = baseListText || "（基地にキャラはいません）";
    }

    loadGame();
    spawnEnemy();
</script>
</body>
</html>
