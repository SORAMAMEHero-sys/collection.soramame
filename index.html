<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STEEL THE BRAINROT</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: white; touch-action: manipulation; margin: 0; padding: 10px; }
        
        /* 巨大な丸い攻撃ボタン */
        #attack-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            font-size: 28px;
            font-weight: bold;
            border: 5px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            cursor: pointer;
            margin: 20px auto;
            display: block;
            outline: none;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        #attack-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        button { padding: 8px 14px; font-size: 14px; margin: 3px; cursor: pointer; }
        #admin-panel { display: none; background: #400; padding: 20px; border: 2px solid red; margin-top: 20px; }
        .panel { border: 1px solid #555; padding: 10px; margin: 10px auto; max-width: 500px; background: #333; text-align: left; }
        
        /* 1行1キャラのリスト表示 */
        .item-list { font-size: 14px; color: #fff; max-height: 160px; overflow-y: auto; background: #222; padding: 5px; margin-top: 5px; }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-bottom: 1px solid #444; }
        .list-row span { flex-grow: 1; margin-left: 8px; }

        #enemy-emoji { font-size: 56px; margin: 10px 0; }
        .status-container { font-size: 16px; font-weight: bold; margin: 10px 0; }
    </style>
</head>
<body>

<h1>STEEL THE BRAINROT</h1>
<div id="game">
    <div id="enemy-emoji">🥔</div>
    <div id="enemy-display" class="status-container">敵出現中！</div>
    <div id="hp-display">HP: --</div>
    <div id="timer-display">制限時間: 30秒</div>
    
    <!-- 巨大な丸い攻撃ボタン -->
    <button id="attack-btn">攻撃！</button>
    
    <div class="panel">
        <div class="inventory">インベントリ (<span id="inv-count">0</span>/50)</div>
        <div id="inv-list" class="item-list">（インベントリは空です）</div>
    </div>

    <div class="panel">
        <div class="base">コレクション基地 (<span id="base-count">0</span>/10) - 整理・強化発動中</div>
        <div id="base-list" class="item-list">（基地にキャラはいません）</div>
    </div>
</div>

<div id="admin-panel">
    <h2>管理者パネル</h2>
    <button id="add-admin-char">隠しキャラ「管理者そらまめ」ゲット</button>
</div>

<script>
    // --- サウンド生成用 (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        let now = audioCtx.currentTime;

        if (type === 'super') {
            // 超レア用：キラキラした高めの2音
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.setValueAtTime(880, now + 0.1); // A5
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'legend') {
            // 伝説レア用：重厚でド派手な低音〜高音の連続音
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // --- ゲームデータ ---
    let state = {
        money: 0,
        inventory: [],
        collection: [],
        baseAttack: 1,
        adminMode: false
    };

    // --- セーブ機能の所（※セーブデータが絶対に消えないように、許可なしで絶対に触らないで） ---
    function loadGame() {
        const saved = localStorage.getItem('brainrot_save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state.money = parsed.money || 0;
                state.inventory = parsed.inventory || [];
                state.collection = parsed.collection || [];
            } catch(e) {
                console.error("セーブデータの読み込みに失敗しました", e);
            }
        }
    }

    function saveGame() {
        // セーブデータが絶対に消えないように、許可なしで絶対に触らないで
        localStorage.setItem('brainrot_save', JSON.stringify(state));
    }
    setInterval(saveGame, 3000);

    // --- モンスターデータ ---
    const monsterTable = [
        // コモン (60%)
        { name: "ぽてとまん", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🥔" },
        { name: "ぞうすい", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🥣" },
        { name: "そらまめ", rarity: "コモン", hp: 10, attackUp: 1, rate: 0.2, emoji: "🟢" },
        // レア (20%)
        { name: "どうごーれむ", rarity: "レア", hp: 50, attackUp: 2, rate: 0.1, emoji: "🗿" },
        { name: "にあれい", rarity: "レア", hp: 50, attackUp: 2, rate: 0.07, emoji: "🤖" },
        { name: "兵士そらまめ", rarity: "レア", hp: 50, attackUp: 3, rate: 0.03, emoji: "🪖" },
        // 激レア (7%)
        { name: "上級海兵そらまめ", rarity: "激レア", hp: 100, attackUp: 4, rate: 0.07, emoji: "⚓" },
        // 超レア (2.5%)
        { name: "きんごーれむ", rarity: "超レア", hp: 300, attackUp: 5, rate: 0.02, trait: "crit", emoji: "✨🗿" },
        { name: "きんぐそらまめ", rarity: "超レア", hp: 300, attackUp: 7, rate: 0.005, trait: "timer17", emoji: "👑" },
        // 伝説レア (0.5%)
        { name: "魔王そらまめ", rarity: "伝説レア", hp: 500, attackUp: 15, rate: 0.005, trait: "timer5", emoji: "🔥😈" }
    ];

    let currentEnemy = null;
    let enemyHp = 0;
    let timeLeft = 30;
    let timerInterval = null;

    // 攻撃力計算
    function getTotalAttack() {
        let base = 1;
        state.collection.forEach(c => {
            base += (c.attackUp || 0);
        });
        return base;
    }

    // 敵のスポーン
    function spawnEnemy() {
        let rarityRoll = Math.random();
        let rarity = "コモン";
        
        if (rarityRoll < 0.005) rarity = "伝説レア";
        else if (rarityRoll < 0.03) rarity = "超レア";
        else if (rarityRoll < 0.1) rarity = "激レア";
        else if (rarityRoll < 0.3) rarity = "レア";

        if (state.adminMode && ["コモン", "レア", "激レア"].includes(rarity)) {
            rarity = "超レア";
        }

        let candidates = monsterTable.filter(m => m.rarity === rarity);
        let enemy = candidates[Math.floor(Math.random() * candidates.length)];
        
        currentEnemy = { ...enemy };
        enemyHp = enemy.hp;

        // レア度に応じた音の再生（管理者キャラは鳴らない）
        if (currentEnemy.rarity === "伝説レア") {
            playSound('legend');
        } else if (currentEnemy.rarity === "超レア") {
            playSound('super');
        }

        let limit = 30;
        if (state.collection.some(c => c.name === "魔王そらまめ")) {
            limit = 5;
        } else if (state.collection.some(c => c.name === "きんぐそらまめ")) {
            limit = 17;
        }
        timeLeft = limit;

        startTimer();
        updateUI();
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft <= 0) {
                spawnEnemy();
            }
            updateUI();
        }, 1000);
    }

    // 攻撃ボタン
    document.getElementById('attack-btn').addEventListener('click', () => {
        if (state.inventory.length >= 50) {
            alert("インベントリが50体上限のため、攻撃できません！");
            return;
        }

        let dmg = getTotalAttack();
        if (state.collection.some(c => c.trait === "crit") && Math.random() < 0.05) {
            dmg *= 2;
        }

        enemyHp -= dmg;

        if (enemyHp <= 0) {
            state.inventory.push(currentEnemy);
            saveGame();
            spawnEnemy();
        } else {
            updateUI();
        }
    });

    // インベントリのキャラを削除（超レア以上は確認ポップアップ）
    window.deleteInventoryItem = function(index) {
        let item = state.inventory[index];
        if (item.rarity === "超レア" || item.rarity === "伝説レア" || item.rarity === "神") {
            if (!confirm(`⚠️【警告】「${item.name}（${item.rarity}）」を本当に削除しますか？`)) {
                return;
            }
        }
        state.inventory.splice(index, 1);
        saveGame();
        updateUI();
    };

    // インベントリからコレクション基地へ送る
    window.sendToBase = function(index) {
        if (state.collection.length >= 10) {
            alert("エラー：コレクション基地は最大10体までです！");
            return;
        }
        let item = state.inventory.splice(index, 1)[0];
        state.collection.push(item);
        saveGame();
        updateUI();
    };

    // コレクション基地から外す（整理・超レア以上はポップアップ確認）
    window.removeFromBase = function(index) {
        let item = state.collection[index];
        if (item.rarity === "超レア" || item.rarity === "伝説レア" || item.rarity === "神") {
            if (!confirm(`⚠️【警告】基地の「${item.name}（${item.rarity}）」を外しますか？`)) {
                return;
            }
        }
        state.collection.splice(index, 1);
        saveGame();
        updateUI();
    };

    // 管理者パネル判定
    if (window.location.href.includes("Secretadmin810")) {
        document.getElementById('admin-panel').style.display = 'block';
        state.adminMode = true;
    }

    // 隠しキャラ追加ボタン
    document.getElementById('add-admin-char').addEventListener('click', () => {
        if (state.collection.length >= 10) {
            alert("コレクション基地が満杯です！");
            return;
        }
        state.collection.push({ name: "管理者そらまめ", rarity: "神", attackUp: 999, emoji: "👑🔥" });
        saveGame();
        updateUI();
    });

    // UI更新
    function updateUI() {
        if (currentEnemy) {
            document.getElementById('enemy-emoji').innerText = currentEnemy.emoji || "❓";
            document.getElementById('enemy-display').innerText = `出現中: [${currentEnemy.rarity}] ${currentEnemy.name}`;
        }
        document.getElementById('hp-display').innerText = `HP: ${enemyHp} / 攻撃力: ${getTotalAttack()}`;
        document.getElementById('timer-display').innerText = `制限時間: ${timeLeft}秒`;
        document.getElementById('inv-count').innerText = state.inventory.length;
        document.getElementById('base-count').innerText = state.collection.length;

        // インベントリのリスト描画（1行1キャラ ＋ 基地ボタン ＆ 削除ボタン）
        let invContainer = document.getElementById('inv-list');
        invContainer.innerHTML = "";
        if (state.inventory.length === 0) {
            invContainer.innerHTML = "（インベントリは空です）";
        } else {
            state.inventory.forEach((c, i) => {
                let row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <span>${i+1}. ${c.emoji}${c.name}(+${c.attackUp})</span>
                    <button onclick="sendToBase(${i})">基地へ</button>
                    <button onclick="deleteInventoryItem(${i})" style="background:#500; color:white;">削除</button>
                `;
                invContainer.appendChild(row);
            });
        }

        // コレクション基地のリスト描画（基地からの外し・整理ボタン付き）
        let baseContainer = document.getElementById('base-list');
        baseContainer.innerHTML = "";
        if (state.collection.length === 0) {
            baseContainer.innerHTML = "（基地にキャラはいません）";
        } else {
            state.collection.forEach((c, i) => {
                let row = document.createElement('div');
                row.className = 'list-row';
                row.innerHTML = `
                    <span>${i+1}. ${c.emoji}${c.name}(+${c.attackUp})</span>
                    <button onclick="removeFromBase(${i})" style="background:#500; color:white;">外す</button>
                `;
                baseContainer.appendChild(row);
            });
        }
    }

    loadGame();
    spawnEnemy();
</script>
</body>
</html>
